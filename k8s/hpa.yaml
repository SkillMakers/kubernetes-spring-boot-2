# Autoscaling : entre 2 et 6 copies, pour garder l'utilisation du processeur autour de 60 % de ce que chaque pod demande
# (resources.requests.cpu). Il faut metrics-server dans le cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
